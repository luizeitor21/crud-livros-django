{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Formulário de Livro</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <h2>{% if livro %}Editar Livro{% else %}Novo Livro{% endif %}</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <label>Título do Livro:</label>
            <input type="text" name="titulo" value="{{ livro.titulo }}" required>
            
            <label>Autor:</label>
            <input type="text" name="autor" value="{{ livro.autor }}" required>
            
            <button type="submit" class="btn">Salvar</button>
            <a href="{% url 'listar' %}" class="btn btn-danger">Cancelar</a>
        </form>
    </div>
</body>
</html>
